services:
  php:
    build: .
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs: [/tmp]
    volumes: [app_logs:/var/www/html/storage/logs]
    security_opt: [no-new-privileges:true]
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on: [php]
    ports: ["127.0.0.1:8081:80"]
    security_opt: [no-new-privileges:true]
volumes: {app_logs: {}}
