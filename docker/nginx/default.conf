limit_req_zone $binary_remote_addr zone=app_login:10m rate=5r/m;
server {
  listen 80; server_name _; root /var/www/html/public; index index.php; charset utf-8; client_max_body_size 64k; server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location ~ ^/(entrar|definir-senha)$ { limit_req zone=app_login burst=3 nodelay; try_files $uri /index.php?$query_string; }
  location / { try_files $uri /index.php?$query_string; }
  location = /index.php { include fastcgi_params; fastcgi_pass php:9000; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; }
  location ~ \.php$ { return 404; } location ~ /\. { deny all; }
}
